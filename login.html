<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ — ปฏิทิน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="page-login">

    <div class="wrapper">
        <div class="container">
            <div class="login">
                <div class="login-left">
                    <div class="login-left-inner">
                        <div class="img-show">
                            <img src="" alt="">
                        </div>
                        <p class="login-brand">ปฏิทินของคุณ</p>
                        <p class="login-tagline">จัดการนัดหมายและเวลาในที่เดียว</p>
                    </div>
                </div>
                <div class="login-right">
                    <form class="login-form" onsubmit="login(event)">
                        <div class="header">
                            <img src="svg/acc.png" alt="">
                            <h1 class="login-title">เข้าสู่ระบบ</h1>
                            <p class="login-sub">กรอกชื่อผู้ใช้เพื่อเริ่มใช้งาน</p>
                        </div>
                        <div class="input-form">
                            <div class="icon">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="form-group">
                                <label class="username-label" for="usernameInput">ชื่อผู้ใช้</label>
                                <input type="text" id="usernameInput" class="input" name="username" required autocomplete="username">
                            </div>
                        </div>
                        <div class="btn">
                            <button type="submit" class="btn-login">
                                <span>เข้าสู่ระบบ</span>
                                <i class="fas fa-arrow-right" aria-hidden="true"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
